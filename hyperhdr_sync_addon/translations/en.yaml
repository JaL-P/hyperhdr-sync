configuration:
  server:
    name: "Music Assistant Sendspin address"
    description: "Keep the default when Music Assistant runs as an add-on on this Home Assistant."
  hyperhdr_host:
    name: "HyperHDR address"
    description: "IP address or hostname of the machine HyperHDR runs on, e.g. 192.168.1.20."
  name:
    name: "Player name"
    description: "Name of the player that appears in Music Assistant."
  effect:
    name: "Effect"
    description: "spectrum, vu (level meter), pulse, ripple, scroll, energy, ambient, lumina (adaptive brightness), colora (adaptive colour), retro, scanner, rhythm, party, flow, centre_pulse, fireflies, snowfall, crystals, braids, embers, aurora, horizon, side_bars, liquid, milkdrop (the real MilkDrop presets), or manual (the custom colour, not following the music). The web UI previews them."
  palette:
    name: "Colours"
    description: "album uses the colours of the cover art, classic is green-yellow-red, custom uses shades of the custom colour, mine uses your own palette (make it in the web UI), milkdrop uses the colours of the MilkDrop picture."
  album_mode:
    name: "Artwork colours"
    description: "How the album colours are picked from the cover: vibrant (all colours, boosted), dominant (the main colour), accent, natural (as on the cover), pastel or contrast (main colour and its opposite)."
  colors:
    name: "Your palette's colours"
    description: "#rrggbb colours of the 'mine' palette, 2 to 6. Easiest to make in the web UI."
  steps:
    name: "Your palette as blocks"
    description: "Show the 'mine' palette as separate blocks of colour instead of blending them."
  my_palettes:
    name: "Saved palettes"
    description: "Palettes you made in the web UI, to pick from again. Managed by the web UI."
  color:
    name: "Custom colour"
    description: "#rrggbb. Used by the manual effect, the custom colours and the night light."
  night_light:
    name: "Night light"
    description: "Brightness in percent of the custom colour while no music plays. 0 hands the LEDs back to HyperHDR (the screen grabber); above 0 the night light stays on instead."
  brightness:
    name: "Brightness"
    description: "Percent, on top of HyperHDR's own brightness."
  sensitivity:
    name: "Sensitivity"
    description: "dB. Raise it if the lights look flat, lower it if they are always bright."
  response:
    name: "Response"
    description: "How quickly the lights follow the music."
  latency_ms:
    name: "Latency"
    description: "Milliseconds the lights run ahead of the music. Raise it if the lights lag."
  udp_port:
    name: "HyperHDR UDP raw receiver port"
    description: "Each HyperHDR LED instance has its own port."
  web_port:
    name: "HyperHDR web port"
    description: "Used to read the LED layout."
  token:
    name: "HyperHDR API token"
    description: "Only needed when HyperHDR is on another subnet than Home Assistant."
  ma_token:
    name: "Music Assistant token (MilkDrop waveform)"
    description: "Optional. A long-lived token from Music Assistant (Settings, your profile). With the MilkDrop Visualizer plugin enabled, the MilkDrop and Liquid effects follow the real sound wave."
  ma_url:
    name: "Music Assistant web address"
    description: "Optional. Defaults to the Sendspin address's host on port 8095, for example http://127.0.0.1:8095."
  milkdrop_preset:
    name: "MilkDrop preset"
    description: "The preset of the MilkDrop effect, by name; empty picks them as your Music Assistant visualizer does. Easiest to pick in the web UI."
  milkdrop_player:
    name: "MilkDrop player"
    description: "Optional. The Music Assistant player id whose sound wave to draw; empty follows the player that is playing."
  log_level:
    name: "Log level"
    description: "debug also logs a summary every 10 seconds."
