name: "HyperHDR Sync"
version: "0.5.2"
slug: "hyperhdr_sync"
description: "Makes your HyperHDR LEDs react to the music Music Assistant plays"
url: "https://github.com/JaL-P/hyperhdr-sync"
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
# The base image starts the bridge through S6 overlay, which must be PID 1.
init: false
# Reaches the Music Assistant add-on on 127.0.0.1 (it uses the host network too).
host_network: true
# Web UI with a live view and previews, in the sidebar. Port 0: the Supervisor picks a free
# one, which matters on the host network; the bridge asks the Supervisor which.
ingress: true
ingress_port: 0
panel_icon: "mdi:led-strip-variant"
panel_title: "HyperHDR Sync"
options:
  server: "ws://127.0.0.1:8927/sendspin"
  name: "HyperHDR LEDs"
  effect: "spectrum"
  palette: "album"
  brightness: 100
  sensitivity: 0
  response: "balanced"
  latency_ms: 120
  color: "#ff9329"
  album_mode: "vibrant"
  colors: []
  steps: false
  my_palettes: []
  night_light: 0
  udp_port: 5568
  web_port: 8090
  log_level: "info"
schema:
  server: "str"
  # no default: the add-on does not start until this is filled in
  hyperhdr_host: "str"
  name: "str"
  effect: "list(spectrum|vu|pulse|ripple|scroll|energy|ambient|lumina|colora|retro|scanner|rhythm|party|manual|flow|centre_pulse|fireflies|snowfall|crystals|braids|embers|aurora|horizon|side_bars|liquid|milkdrop)"
  palette: "list(album|rainbow|sunset|ocean|fire|forest|neon|aurora|pastel|ice|candy|lava|warm|classic|custom|mine|milkdrop)"
  brightness: "int(0,100)"
  sensitivity: "float(-12,12)"
  response: "list(snappy|balanced|smooth)"
  latency_ms: "int(0,2000)"
  color: "match(^#[0-9a-fA-F]{6}$)"
  album_mode: "list(vibrant|dominant|accent|natural|pastel|contrast)"
  # the colours of the "mine" palette, which the web UI makes
  colors:
    - "match(^#[0-9a-fA-F]{6}$)"
  steps: "bool"
  # palettes made in the web UI; each palette's colours are one comma-separated string
  my_palettes:
    - name: "str"
      colors: "match(^#[0-9a-fA-F]{6}(,#[0-9a-fA-F]{6}){1,5}$)"
      steps: "bool"
  night_light: "int(0,100)"
  udp_port: "port"
  web_port: "port"
  token: "password?"
  # Music Assistant long-lived token: MilkDrop and Liquid then follow the real sound wave
  # from the MilkDrop Visualizer plugin
  ma_token: "password?"
  ma_url: "url?"
  milkdrop_player: "str?"
  # the MilkDrop effect's preset; empty for a random one every 30 seconds
  milkdrop_preset: "str?"
  log_level: "list(debug|info|warning|error)"
